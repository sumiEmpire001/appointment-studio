<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Appointment Studio</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="wrap"><p class="eyebrow">Appointment Studio</p><h1>Make time for what matters.</h1><p>A simple, private appointment scheduling demonstration.</p></div></header>
<main class="wrap"><section class="panel"><h2>Book an appointment</h2><form id="form"><label>Your name<input id="name" name="name" required minlength="2" maxlength="80" autocomplete="name"></label><label>Appointment date<input id="date" name="date" type="date" required></label><label>Available time<select id="time" name="time" required></select></label><button type="submit">Confirm booking</button></form><p id="message" role="status" aria-live="polite"></p></section>
<section class="panel"><h2>Your bookings on this device</h2><div id="bookings"></div></section><p class="note">Demo only: bookings are stored in this browser and are not synchronized with a business or server. Do not enter sensitive information.</p></main><script type="module" src="app.js"></script></body></html>
